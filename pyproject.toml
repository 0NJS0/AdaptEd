[project]
name = "adapted"
version = "0.1.0"
description = "Intelligent Adaptive Education Assistant - multi-agent AI education platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "pgvector>=0.2.5",
    "psycopg[binary]>=3.1.0",
    "openai>=1.40.0",
    "langgraph>=0.2.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "streamlit>=1.37.0",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapted"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
